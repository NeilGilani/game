<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AGENCY wants to help on a protected site</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="pages.css">
</head>
<body class="allow">
  <main>
    <h1>Let AGENCY help on <span id="site">this site</span>?</h1>
    <p id="why">This is a protected site.</p>
    <p>If you say yes, AGENCY can read and use this site until you close Chrome. It will still ask you before
      anything important, and it never reads or types passwords, codes or card numbers.</p>
    <div class="choices">
      <button id="no" type="button" class="big no">No, keep it private</button>
      <button id="yes" type="button" class="big yes" disabled>Yes, allow for now</button>
    </div>
    <p class="hint" id="hint">“Yes” becomes available in a moment.</p>
  </main>
  <script src="allow.js"></script>
</body>
</html>
