<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AGENCY overlay</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <!-- Built-in fallback overlay, used until os/overlay (Instance 3) is installed. Help and Stop are protected:
         they work by gaze dwell, mouse click, and while eye control is paused. -->
    <div id="dwell-layer" aria-hidden="true"></div>
    <div id="protected" role="toolbar" aria-label="Always available">
      <button
        id="help"
        class="protected help"
        data-testid="overlay-help"
        aria-label="Help: call for help now"
      >
        <span class="ring" aria-hidden="true"></span><span class="label">Help</span>
      </button>
      <button
        id="stop"
        class="protected stop"
        data-testid="overlay-stop"
        aria-label="Stop everything AGENCY is doing"
      >
        <span class="ring" aria-hidden="true"></span><span class="label">Stop</span>
      </button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="cursor" aria-hidden="true"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
