<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <!-- .dmg window background (1x; rendered at 2x too). Icons sit at (170, 210) and (490, 210). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f5f0"/>
      <stop offset="1" stop-color="#e9e5da"/>
    </linearGradient>
  </defs>
  <rect width="660" height="420" fill="url(#bg)"/>
  <text x="330" y="64" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
        font-size="26" font-weight="700" fill="#111a26">Install AGENCY</text>
  <text x="330" y="96" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', sans-serif"
        font-size="16" fill="#4a4f57">Drag AGENCY onto the Applications folder</text>
  <!-- Arrow from the app to Applications. -->
  <path d="M262 214 C300 190 352 188 388 202" fill="none" stroke="#0b6b5c" stroke-width="7" stroke-linecap="round"/>
  <path d="M380 186 L406 208 L372 220 Z" fill="#0b6b5c"/>
  <text x="330" y="370" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', sans-serif"
        font-size="13" fill="#6b6f76">Then open AGENCY from Applications. A helper can do the first setup.</text>
</svg>
