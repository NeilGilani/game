<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- AGENCY app icon. macOS grid: 824 px squircle body centred on a 1024 canvas, soft drop shadow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17907c"/>
      <stop offset="1" stop-color="#0b5a4d"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ffe58a"/>
      <stop offset="1" stop-color="#f2b400"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- Superellipse-style squircle (continuous corners), 824 x 824 at (100, 100). -->
  <path filter="url(#shadow)" fill="url(#bg)" d="M100 400 C100 152 152 100 400 100 L624 100 C872 100 924 152 924 400 L924 624 C924 872 872 924 624 924 L400 924 C152 924 100 872 100 624 Z"/>
  <!-- An open eye: the person's gaze is their way in. -->
  <path fill="#ffffff"
    d="M232 520 C312 392 410 330 512 330 C614 330 712 392 792 520 C712 648 614 710 512 710 C410 710 312 648 232 520 Z"/>
  <circle cx="512" cy="520" r="132" fill="url(#iris)"/>
  <circle cx="512" cy="520" r="62" fill="#0b2a26"/>
  <circle cx="548" cy="482" r="22" fill="#ffffff"/>
</svg>
