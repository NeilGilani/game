<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Join the library</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 24px auto; max-width: 640px; padding: 0 24px; }
      label { display: block; margin-top: 12px; }
      input, textarea, select { font-size: 16px; padding: 4px 6px; width: 100%; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <h1>Join the library</h1>
    <form action="thanks" method="get">
      <label for="name">Your name</label>
      <input id="name" name="name" autocomplete="name" />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" />
      <label for="branch">Branch</label>
      <select id="branch" name="branch">
        <option>Main library</option>
        <option>Riverside</option>
        <option>Hilltop</option>
      </select>
      <label for="note">Anything else?</label>
      <textarea id="note" name="note" rows="3"></textarea>
      <p><button type="submit">Join now</button></p>
    </form>
  </body>
</html>
