# CI for AGENCY and AGENCY OS.
#   linux:  make check (backend + frontend + OS packages) and the browser end-to-end tests (Playwright)
#   macos:  the same checks plus the Electron smoke tests (_electron.launch), the frozen coordinator and an
#           unsigned .dmg build, on Apple silicon
name: CI

on:
  push:
    branches: [main, "os-1/**", integrate]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  linux:
    name: make check + browser e2e (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Setup
        run: make setup
      - name: make check
        run: make check
      - name: Install Chromium for Playwright
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: make e2e
      - name: Memory end-to-end tests
        run: cd frontend && npx playwright test -c e2e/memory/playwright.config.ts
      - name: Task packs end-to-end tests (os/tasks harness)
        run: npm run e2e -w @agency/tasks
      - name: Chromium for the bridge's Playwright version
        run: cd os/browser-bridge && npx playwright install --with-deps chromium
      - name: AGENCY Bridge end-to-end tests (headless Chromium, sandbox web world)
        run: npm run e2e -w @agency/browser-bridge
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-test-results
          path: |
            frontend/test-results
            os/*/test-results
            site/test-results
          if-no-files-found: ignore

  macos:
    name: desktop app (macos, Apple silicon)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Setup
        run: make setup
      - name: OS checks (contracts, desktop types and unit tests)
        run: make os-check
      - name: agency-native (Swift) build and tests
        run: |
          cd os/native-macos
          swift build -c release --product agency-native
          scripts/test.sh
      - name: Memory privacy tests with a real (throwaway) keychain
        run: cd backend && .venv/bin/python -m pytest -q tests/test_memory_privacy.py
      - name: Build the interface and OS packages
        run: make os-build
      - name: Electron smoke tests (Playwright _electron)
        run: make os-e2e
      - name: Frozen coordinator (PyInstaller) with size and startup time
        run: make sidecar
      - name: Package an unsigned .dmg
        run: npm run dist -w @agency/desktop -- --arch arm64
      - name: Launch the packaged app and wait for its coordinator
        run: bash os/desktop/scripts/packaged-smoke.sh os/desktop/dist/mac-arm64/AGENCY.app
      - name: Summary
        if: always()
        run: |
          {
            echo "### AGENCY OS on $(sw_vers -productName) $(sw_vers -productVersion) ($(uname -m))"
            if [ -f os/sidecar/dist/measurements.json ]; then echo '```json'; cat os/sidecar/dist/measurements.json; echo '```'; fi
            ls -l os/desktop/dist/*.dmg 2>/dev/null | awk '{print "- " $NF ": " $5/1000000 " MB"}'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-results
          path: |
            os/desktop/test-results
            os/sidecar/dist/measurements.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: AGENCY-unsigned-arm64-dmg
          path: os/desktop/dist/*.dmg
          retention-days: 7
